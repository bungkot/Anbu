services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"   # localhost only; safe for dev
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"        # memory saving
      OLLAMA_MAX_LOADED_MODELS: "1"   # memory saving
      OLLAMA_FLASH_ATTENTION: "1"     # saves KV cache memory
      OLLAMA_KV_CACHE_TYPE: q8_0      # 8-bit KV cache (requires flash attention)
    volumes:
      - ollama:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Single application/dev service. The image contains Node, the OpenCode CLI,
  # and the built app; the repository is mounted at /workspace for development.
  app:
    build:
      context: .
      target: runtime
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-granite3.3:2b}
      ANBU_SCOPE_FILE: ${ANBU_SCOPE_FILE:-scope/example.json}
      ANBU_EVIDENCE_DIR: ${ANBU_EVIDENCE_DIR:-workspace/evidence}
      ANBU_AUTH_TOKEN: ${ANBU_AUTH_TOKEN:-}
      ANBU_MAX_REQUESTS: ${ANBU_MAX_REQUESTS:-800}
      ANBU_MAX_DURATION_MINUTES: ${ANBU_MAX_DURATION_MINUTES:-60}
      ANBU_MAX_MODEL_TURNS: ${ANBU_MAX_MODEL_TURNS:-120}
      ANBU_MAX_FINDINGS_PER_CATEGORY: ${ANBU_MAX_FINDINGS_PER_CATEGORY:-25}
      ANBU_MAX_BODY_BYTES: ${ANBU_MAX_BODY_BYTES:-65536}
      ANBU_MAX_REDIRECTS: ${ANBU_MAX_REDIRECTS:-3}
      ANBU_REQUESTS_PER_SECOND_PER_HOST: ${ANBU_REQUESTS_PER_SECOND_PER_HOST:-5}
      ANBU_RATE_LIMIT_WAIT_MS: ${ANBU_RATE_LIMIT_WAIT_MS:-1000}
      ANBU_READ_ONLY: ${ANBU_READ_ONLY:-true}
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    mem_limit: ${APP_MEM_LIMIT:-0.75g}
    # Keep the container alive for the dev container and interactive exec.
    # One-off runs override the entrypoint:
    #   docker compose run --rm --entrypoint node app /app/dist/index.js ask "..."
    entrypoint: ["sleep", "infinity"]

volumes:
  ollama:
